[project]
name = "ds-llm"
version = "0.1.0"
description = "Shared kernel: HuggingFace LLM stack na bazie ds-dl."
requires-python = ">=3.13"
dependencies = [
    "ds-dl",
    "transformers>=4.45",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "accelerate>=1.0",
    "peft>=0.13",
    "sentencepiece>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_llm"]

[tool.uv.sources]
ds-dl = { workspace = true }
