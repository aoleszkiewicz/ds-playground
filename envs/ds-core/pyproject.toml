[project]
name = "ds-core"
version = "0.1.0"
description = "Shared kernel: numerics, classical ML, plotting, jupyter."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "scipy>=1.14",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "plotly>=6.7.0",
    "jupyter>=1.1",
    "ipykernel>=6.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_core"]
