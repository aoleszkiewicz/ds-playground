[project]
name = "ds-playground"
version = "0.1.0"
description = "Playground na eksperymenty DS: statystyka, matma, klasyczny ML, DL, mini-LLMy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gensim>=4.4.0",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
]

[tool.uv.workspace]
members = ["envs/ds-core", "envs/ds-dl", "envs/ds-llm"]
